# Courier — example configuration
# Copy to config.yaml and edit for your setup.

settings:
  poll_interval_minutes: 5
  dedup_persistence: "state.json"
  nitter_fallback: "xcancel.com"

# X/Twitter RSS providers, tried in order until one returns actual tweets.
#
# Public Nitter instances rot fast, and several serve a valid-looking feed that
# contains no tweets at all (a whitelist or signup interstitial), so list
# several and let Courier fall through them. Run `courier --diagnose` to see
# which of these are answering for you today — HTTP 200 is not evidence of a
# working timeline; a `/status/<tweet-id>` link is.
#
# An entry is either a base URL, which gets Nitter's `/<handle>/rss` layout, or
# a template naming {handle}, for a provider that shapes URLs differently
# (a self-hosted bridge, an RSSHub route, a per-handle hosted feed).
nitter_instances:
  - "https://xcancel.com"
  - "https://nitter.poast.org"
  - "https://nitter.tiekoetter.com"
  - "https://nitter.catsarch.com"
  - "https://lightbrd.com"
  - "https://nuku.trabun.org"
  - "https://nitter.kareem.one"
  - "https://nitter.privacyredirect.com"
  - "https://nitter.space"
  # Non-Nitter providers slot into the same chain via a {handle} template:
  # - "https://rsshub.example.com/twitter/user/{handle}"

# The legacy mapping form still loads:
#   nitter_instances:
#     primary: "https://xcancel.com"
#     fallback: "https://nitter.poast.org"
#     other_options: ["https://lightbrd.com"]

sources:
  - handle: "FabrizioRomano"
    display_name: "Fabrizio Romano"
    type: nitter
    active: true

  - handle: "David_Ornstein"
    display_name: "David Ornstein"
    type: nitter
    active: true

  - handle: "TheAthleticFC"
    display_name: "The Athletic Football"
    type: nitter
    active: true

  - handle: "DeadlineDayLive"
    display_name: "Deadline Day"
    type: nitter
    active: false

  # YouTube channels are polled via their public RSS feed (no API key).
  # Identify the channel by its UC id (most reliable), an @handle, or a URL —
  # Courier resolves a handle/URL to a channel id on first poll.
  - handle: "@mkbhd"
    display_name: "MKBHD"
    type: youtube
    channel_id: "UCBJycsmduvYEL83R_U4JriQ"
    active: true

  # The same thing by @handle only — Courier resolves the channel id for you.
  - handle: "@veritasium"
    display_name: "Veritasium"
    type: youtube
    active: true

destinations:
  - id: "futbol"
    webhook_url: "https://discord.com/api/webhooks/your-webhook-id/your-webhook-token"
    display_name: "#futbol"

  - id: "transfers"
    webhook_url: "https://discord.com/api/webhooks/your-webhook-id/your-webhook-token"
    display_name: "#transfers"

  - id: "tech"
    webhook_url: "https://discord.com/api/webhooks/your-webhook-id/your-webhook-token"
    display_name: "#tech"

# Routes can be grouped by destination channel. This keeps the config easy to
# scan when several sources fan into the same Discord channel.
routes:
  - channel: "futbol"
    sources:
      - "FabrizioRomano"
      - "David_Ornstein"
      - "TheAthleticFC"

  - channel: "transfers"
    sources:
      - "FabrizioRomano"
      - "David_Ornstein"

  - channel: "tech"
    sources:
      - "@mkbhd"
      - "@veritasium"
